services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-logostech}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logostech}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logostech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-logostech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logostech} -d ${POSTGRES_DB:-logostech}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
